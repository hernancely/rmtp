version: '3.8'

services:
  nginx:
    build: 
      context: .
      dockerfile: Dockerfile.nginx
    container_name: gnix-rtmp-server
    ports:
      - "1935:1935"    # RTMP port
      - "8080:8080"    # HTTP/HLS port
    volumes:
      - ./data/hls:/var/hls
      - ./data/recordings:/var/recordings
      - ./www:/var/www
    networks:
      - rtmp-network
    restart: unless-stopped
    environment:
      - NGINX_WORKER_PROCESSES=auto
    depends_on:
      - web

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: gnix-dashboard
    ports:
      - "3000:3000"
    volumes:
      - ./data/recordings:/var/recordings
      - ./public:/app/public
    networks:
      - rtmp-network
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - RTMP_SERVER=${EXTERNAL_IP:-localhost}
      - PORT=3000

networks:
  rtmp-network:
    driver: bridge

volumes:
  hls-data:
  recordings-data: