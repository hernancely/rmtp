error_log /dev/stdout info;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4000;

        # Aplicación principal para recibir stream de cámara
        application live {
            live on;
            
            # Permitir conexiones (en producción limitar IPs)
            allow publish all;
            allow play all;
            
            # Generar HLS automáticamente
            hls on;
            hls_path /opt/data/hls;
            hls_fragment 3;
            hls_playlist_length 20;
            hls_cleanup on;
            hls_continuous on;
            
            # Configuración para mejor compatibilidad
            hls_fragment_naming system;
            hls_nested on;
            
            # Grabación opcional
            record all;
            record_path /opt/data/recordings;
            record_unique on;
            record_suffix .flv;
        }
    }
}

http {
    root /www/static;
    sendfile off;
    tcp_nopush on;
    server_tokens off;
    access_log /dev/stdout combined;

    server {
        listen 80;
        server_name localhost;

        # Página principal con el reproductor
        location / {
            root /www/static;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Servir archivos HLS
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /opt/data;
            
            # Headers para CORS y optimización
            add_header Cache-Control no-cache always;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
            add_header Access-Control-Expose-Headers 'Content-Length,Content-Range' always;
            
            # Configuración específica para archivos .m3u8
            location ~* \.m3u8$ {
                add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
                add_header Pragma 'no-cache' always;
                add_header Expires '0' always;
            }
        }

        # Alias alternativo para /live
        location /live {
            alias /opt/data/hls;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            add_header Cache-Control no-cache always;
            add_header Access-Control-Allow-Origin * always;
        }

        # Estadísticas del servidor RTMP
        location /stats {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            root /www/static;
        }

        # API para control de streams
        location /control {
            rtmp_control all;
        }
    }
}
