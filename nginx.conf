worker_processes auto;
rtmp_auto_push on;

events {
    worker_connections 1024;
}

# RTMP configuration
rtmp {
    server {
        listen 1935;
        chunk_size 4000;

        application live {
            live on;
            
            # Allow publishing from any IP
            allow publish all;
            
            # HLS configuration for web viewing
            hls on;
            hls_path /var/hls;
            hls_fragment 3;
            hls_playlist_length 60;
            
            # Recording configuration
            record all;
            record_path /var/recordings;
            record_unique on;
            record_suffix .flv;
            
            # Forward stream for additional processing
            push rtmp://localhost:1936/record;
            
            # Stream key validation (optional)
            # on_publish http://web:3000/auth;
        }
        
        application record {
            live on;
            allow publish 127.0.0.1;
            deny publish all;
            
            # Recording with timestamp
            record all;
            record_path /var/recordings;
            record_unique on;
            record_suffix _rec.mp4;
            record_lock on;
        }
    }
}

# HTTP configuration for serving HLS and dashboard
http {
    sendfile off;
    tcp_nopush on;
    aio on;
    directio 512;
    default_type application/octet-stream;

    server {
        listen 8080;
        
        # CORS headers for web player
        location / {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods GET,POST,OPTIONS;
            add_header Access-Control-Allow-Headers Content-Type;
            
            root /var/www;
            index index.html;
        }
        
        # HLS streams
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /var;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }
        
        # RTMP statistics
        location /stats {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
            add_header Access-Control-Allow-Origin *;
        }
        
        location /stat.xsl {
            root /var/www;
        }
        
        # API endpoints
        location /api/ {
            proxy_pass http://web:3000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}