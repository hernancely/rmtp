# Configuración de Firewall para GNIX RTMP Server
# Este archivo documenta las reglas de firewall necesarias

# Regla principal (creada automáticamente por deploy-gcp.sh)
gnix-rtmp-ports:
  direction: INGRESS
  priority: 1000
  network: default
  action: ALLOW
  rules: tcp:1935,tcp:3000,tcp:80,tcp:8080
  source-ranges: 0.0.0.0/0
  target-tags: rtmp-server

# Reglas adicionales de seguridad recomendadas:

# 1. SSH restringido (opcional - solo desde tu IP)
ssh-restricted:
  direction: INGRESS
  priority: 900
  network: default
  action: ALLOW
  rules: tcp:22
  source-ranges: TU_IP_PUBLICA/32  # Cambiar por tu IP
  target-tags: rtmp-server

# 2. Dashboard solo desde IPs específicas (opcional)
dashboard-restricted:
  direction: INGRESS
  priority: 900
  network: default
  action: ALLOW
  rules: tcp:3000
  source-ranges: TU_IP_PUBLICA/32,OTRA_IP/32
  target-tags: rtmp-server

# 3. RTMP desde rango de IPs conocidas (opcional)
rtmp-restricted:
  direction: INGRESS
  priority: 900
  network: default
  action: ALLOW
  rules: tcp:1935
  source-ranges: TU_RED_LOCAL/24  # ej: 192.168.1.0/24
  target-tags: rtmp-server

# Comandos para aplicar reglas adicionales:
#
# gcloud compute firewall-rules create ssh-restricted \
#   --direction=INGRESS --priority=900 --network=default \
#   --action=ALLOW --rules=tcp:22 \
#   --source-ranges=TU_IP/32 --target-tags=rtmp-server
#
# gcloud compute firewall-rules create dashboard-restricted \
#   --direction=INGRESS --priority=900 --network=default \
#   --action=ALLOW --rules=tcp:3000 \
#   --source-ranges=TU_IP/32 --target-tags=rtmp-server